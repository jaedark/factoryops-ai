services:
  factory-agent:
    image: factory-agent:day22
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FACTORY_AGENT_PORT:-8000}:8000"
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
