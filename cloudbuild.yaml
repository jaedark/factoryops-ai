steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=2
      - --memory=4Gi
      - --min-instances=0
      - --max-instances=1
      - --concurrency=1
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=APP_ENV=production
      - --set-secrets=GEMINI_API_KEY=${_SECRET_NAME}:${_SECRET_VERSION},FACTORY_AGENT_API_KEY=${_API_SECRET_NAME}:${_API_SECRET_VERSION}
      - --no-allow-unauthenticated
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: factory-agent
  _IMAGE_NAME: factory-agent
  _IMAGE_TAG: manual
  _SERVICE_NAME: factory-agent
  _RUNTIME_SERVICE_ACCOUNT: factory-agent-runtime
  _SECRET_NAME: factory-agent-gemini-api-key
  _SECRET_VERSION: "1"
  _API_SECRET_NAME: factory-agent-api-key
  _API_SECRET_VERSION: "1"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
